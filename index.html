<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cellular Automata Sandbox</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <h1>Cellular Automata</h1>

      <div class="control-group" id="import-section">
        <label>Import Parameters</label>
        <div class="import-row">
          <input type="text" id="import-input" placeholder="Paste parameter string..." />
          <button id="import-load-btn">Load</button>
        </div>
        <input type="file" id="import-file" accept=".txt" />
        <select id="import-select" style="display: none">
          <option value="">Select from file...</option>
        </select>
      </div>

      <div class="control-group">
        <label>Preset</label>
        <select id="preset-select">
          <option value="" disabled>Select preset...</option>
        </select>
      </div>

      <div class="control-group">
        <label>Type</label>
        <select id="type-select">
          <option value="2d">2D</option>
          <option value="1d">1D</option>
        </select>
      </div>

      <!-- 1D Settings -->
      <div id="settings-1d" style="display: none">
        <div class="control-group">
          <label>Rule (0–255)</label>
          <input type="number" id="rule-input" min="0" max="255" value="30" />
        </div>
        <div id="rule-display" class="rule-display"></div>
        <div class="control-group">
          <label>Width</label>
          <input type="number" id="width-1d" min="10" max="2000" value="301" />
        </div>
        <div class="control-group">
          <label>Initial State</label>
          <select id="init-1d">
            <option value="center">Single cell (center)</option>
            <option value="random">Random</option>
          </select>
        </div>
      </div>

      <!-- 2D Settings -->
      <div id="settings-2d">
        <div class="control-group">
          <label>Birth (B)</label>
          <div id="birth-checks" class="bs-checks"></div>
        </div>
        <div class="control-group">
          <label>Survival (S)</label>
          <div id="survival-checks" class="bs-checks"></div>
        </div>
        <div class="control-group">
          <label>Width</label>
          <input type="number" id="width-2d" min="10" max="500" value="100" />
        </div>
        <div class="control-group">
          <label>Height</label>
          <input type="number" id="height-2d" min="10" max="500" value="100" />
        </div>
        <div class="control-group">
          <label>Initial State</label>
          <select id="init-2d">
            <option value="random">Random</option>
            <option value="center">Pattern / Center</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div class="control-group" id="density-row">
          <label>Density: <span id="density-value">0.3</span></label>
          <input type="range" id="density-input" min="0.01" max="1" step="0.01" value="0.3" />
        </div>
        <div class="control-group" id="pattern-row" style="display: none">
          <label>Pattern</label>
          <select id="pattern-select"></select>
        </div>
        <div class="control-group" id="custom-pattern-row" style="display: none">
          <label>Draw Pattern</label>
          <select id="grid-size-select">
            <option value="3">3×3</option>
            <option value="4">4×4</option>
            <option value="5" selected>5×5</option>
          </select>
          <div class="custom-grid" id="custom-grid"></div>
          <button id="custom-clear-btn">Clear</button>
        </div>
      </div>

      <hr />

      <!-- Playback Controls -->
      <div class="playback">
        <button id="play-btn">Play</button>
        <button id="step-btn">Step</button>
        <button id="reset-btn">Reset</button>
      </div>

      <div class="control-group">
        <label>Speed: <span id="speed-value">10</span> gen/s</label>
        <input type="range" id="speed-input" min="1" max="60" value="10" />
      </div>

      <div class="gen-counter">
        Generation: <span id="gen-display">0</span>
      </div>
    </aside>

    <main class="canvas-area">
      <canvas id="canvas"></canvas>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
